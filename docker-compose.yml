# ===================================================================
# Docker Compose — DÉPLOIEMENT DOKPLOY (branche dokploy)
# -------------------------------------------------------------------
# Services préfixés `faith-` pour cohabiter sans collision avec les
# autres projets déployés sur le même `dokploy-network` (réseau partagé).
# Le routage HTTPS/domaine est géré par Dokploy (Traefik) vers le
# service `faith-api` sur le port 8000 — aucun port n'est exposé ici.
# ===================================================================

services:
  faith-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: faith-api:latest
    restart: always
    env_file:
      - .env
    environment:
      # config.py construit l'URL DB à partir de ces variables.
      # POSTGRES_HOST DOIT correspondre au nom du service postgres ci-dessous.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaapi
      POSTGRES_HOST: faith-db
      REDIS_HOST: faith-redis
      REDIS_PORT: 6379
      ENVIRONMENT: production
      PYTHONUNBUFFERED: 1
      VAULT_ADDR: http://faith-vault:8200
      VAULT_TOKEN: dev-token
      MINIO_ENDPOINT: faith-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
    # create_db (idempotent) crée le schéma + sème rôles et comptes démo,
    # puis lance l'API. Évite toute étape manuelle après le déploiement.
    command: sh -c "python -m app.create_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      faith-db:
        condition: service_healthy
      faith-redis:
        condition: service_healthy
      faith-vault:
        condition: service_healthy
      faith-minio:
        condition: service_healthy
    networks:
      - dokploy-network

  faith-celery:
    image: faith-api:latest
    restart: always
    command: python -m celery -A app.core.celery worker --loglevel=info
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaapi
      POSTGRES_HOST: faith-db
      REDIS_HOST: faith-redis
      REDIS_PORT: 6379
      ENVIRONMENT: production
      VAULT_ADDR: http://faith-vault:8200
      VAULT_TOKEN: dev-token
    depends_on:
      faith-api:
        condition: service_started
      faith-db:
        condition: service_healthy
      faith-redis:
        condition: service_healthy
      faith-vault:
        condition: service_healthy
    networks:
      - dokploy-network

  faith-metrics:
    image: faith-api:latest
    restart: always
    command: python app/metrics_server.py
    env_file:
      - .env
    depends_on:
      faith-api:
        condition: service_started
    networks:
      - dokploy-network

  faith-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaapi
    volumes:
      - faith_postgres_data:/var/lib/postgresql/data/
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  faith-redis:
    image: redis:7-alpine
    restart: always
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  faith-vault:
    image: hashicorp/vault:latest
    restart: always
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - faith_vault_data:/vault/file
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

  faith-minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - faith_minio_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 3

volumes:
  faith_postgres_data:
  faith_minio_data:
  faith_vault_data:

networks:
  dokploy-network:
    external: true
